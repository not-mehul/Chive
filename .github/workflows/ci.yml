name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - name: Ruff
        run: ruff check .
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: JS syntax
        run: for f in static/js/*.js; do node --check "$f"; done

  python:
    name: python (${{ matrix.os }} · py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Unit + integration tests
        # Integration tests download from a local HTTP server — no internet needed.
        run: python -W error::ResourceWarning -m unittest discover -s tests -v

  javascript:
    name: javascript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Unit tests
        run: npm test

  e2e:
    name: end-to-end (browser)
    runs-on: ubuntu-latest
    needs: [python, javascript]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install
        run: |
          pip install -r requirements.txt
          npm install
          npx playwright install --with-deps chromium
      - name: Smoke test
        env:
          PYTHON: python
        run: npm run test:e2e
